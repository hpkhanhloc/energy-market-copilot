[project]
name = "energy-market-copilot"
version = "0.1.0"
description = "MVP copilot that explains unusual moves in the Finnish power market"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "plotly>=5.24",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "pydantic-ai-slim[anthropic,openai]>=2.42.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify,
# RUF ruff-specific, PT pytest style, PTH prefer pathlib, DTZ naive-datetime guard,
# T20 no stray print in library code, N naming.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "PTH", "DTZ", "T20", "N"]
ignore = ["E501"]  # formatter handles line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "DTZ"]
"cli.py" = ["T20"]
"app.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["copilot"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Start strict; loosen a rule here only with a comment saying why.
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:copilot.*"]

[tool.coverage.run]
source = ["copilot"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]
